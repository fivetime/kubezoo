# 租户不应感知节点,更不该能往每个节点上投放 Pod。
#
# kubezoo 的 FAQ 一直宣称限制 DaemonSet,但代理层从未拒绝过 —— 实测租户能创建成功,
# 并且 Pod 真的在平台节点上跑起来(DESIRED 1 / CURRENT 1)。
# 这条约束"换个平台会变"(有的平台可能允许受限的 DaemonSet),所以归策略层。
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-deny-daemonset
  annotations:
    policies.kyverno.io/title: 租户不得创建 DaemonSet
spec:
  failurePolicy: Fail
  background: false
  validationFailureAction: Enforce
  rules:
    - name: deny-daemonset
      match:
        any:
          - resources:
              kinds: [DaemonSet]
              # ⭐ 判据:命名空间带 kubezoo.io/tenant 标签 —— 这是 kubezoo 保证、
              # 租户改不动的东西(四种摘法实测都失败)。**不要换成硬编码平台
              # namespace 的排除表**:那样平台以后新增一个组件 namespace
              # (如 ingress-nginx)就会被当成租户 —— 实测它的 DaemonSet 被拒、
              # Pod 的 runtimeClassName 被剥掉。
              namespaceSelector:
                matchExpressions:
                  - key: kubezoo.io/tenant
                    operator: Exists
      validate:
        message: >-
          DaemonSet is not available to tenants: it places a pod on every node of
          the shared cluster, and tenants are not meant to address nodes at all.
          Use a Deployment and let the scheduler place it.
        deny: {}
