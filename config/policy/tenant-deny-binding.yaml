# 租户不得直接把 Pod 绑到节点上。
#
# ⚠️ 这个文件**不是 Kyverno 策略**,是 k8s 1.36 原生的 ValidatingAdmissionPolicy。
# 原因是实测出来的,不是偏好:
#
#   Kyverno(chart 3.8.2)用 `kinds: [Pod/binding]` 匹配子资源**不生效** ——
#   策略 Ready、rulecount=1、连 `pods/binding` 的 webhook 都注册上了,
#   但 binding 照样成功,Kyverno 日志里连这次请求都没有。
#   经 kubezoo 和直连上游两条路都试过,去掉 namespaceSelector 也一样。
#   (审计 §R⑤)
#
# 为什么这条必须存在:租户在自己 namespace 里是 `*` on `*`(controller/rbac.go:270,
# 有意为之,为覆盖租户 CRD),因此**含 `create pods/binding`** —— 而 k8s 只把这个
# 子资源给 system:kube-scheduler。不堵的话租户可以把 Pod 直接绑到别的租户节点上:
# 实测绑得上去(API 层成功),只是 kubelet 因 nodeSelector 不匹配而拒绝运行。
# 那是**节点侧的遏制,不是 API 侧的阻止**。
#
# ⚠️ 表达式是**只放行调度器**,不是"拒绝租户" —— 调度器绑定走的是同一条子资源,
# 写成无条件拒绝会让所有 Pod 永远 Pending。已用负向对照验证调度器不受影响。
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-deny-binding
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding", "bindings"]
  validations:
    - expression: "request.userInfo.username == 'system:kube-scheduler'"
      message: "binding a pod to a node is the scheduler's job; tenants hold no scheduling authority"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-deny-binding
spec:
  policyName: tenant-deny-binding
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubezoo.io/tenant
          operator: Exists
