# 租户不得自己决定 Pod 落在哪个节点。
#
# 两条都只在 CREATE 上匹配,不是偷懒:调度器把 Pod 绑到节点走的是 pods/binding 子资源,
# 但绑定之后 spec.nodeName 就有值了,任何后续 UPDATE(改标签、加注解)都会带着它 ——
# 规则若也匹配 UPDATE,已调度的 Pod 就再也改不动了。
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-scheduling
  annotations:
    policies.kyverno.io/title: 租户不得指定节点
spec:
  failurePolicy: Fail
  background: false
  validationFailureAction: Enforce
  rules:
    - name: deny-nodename
      match:
        any:
          - resources:
              kinds: [Pod]
              operations: [CREATE]
              namespaceSelector:
                matchExpressions:
                  - key: kubezoo.io/tenant
                    operator: Exists
      validate:
        message: >-
          spec.nodeName is not available to tenants: setting it bypasses the
          scheduler and pins the pod to a node of your choosing. Let the
          scheduler place it.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.nodeName || '' }}"
                operator: NotEquals
                value: ""

# ⚠️ 这里原本还有一条 restrict-tolerations(白名单 validate)。**已删除** ——
# 它是节点池方案落地前的过渡,和 tenant-placement.yaml 的注入**直接冲突**:
# 准入链是所有 mutating 先跑完再跑 validating,平台注入的池子 toleration
# 会被这条白名单拒掉。**实测确认**:租户建 Pod 报
#   tenant-scheduling: restrict-tolerations: Only the tolerations Kubernetes adds itself are allowed
# 现在 tolerations 由 tenant-placement.yaml **整体替换**,不需要再验。
#
# deny-nodename 保留:替换只管 PodSpec 字段,而 nodeName 一旦设上就跳过调度器。
# 按一句话原则(租户没有任何调度权),这条继续拒。
