name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Build
        run: make build
      # The suites that needed an apiserver left with the packages they cover:
      # reconciliation to kubezoo-controller, the scope table to
      # kubezoo-contract. Nothing here needs envtest any more.
      #
      # ⚠️ Green here is a weaker signal than it used to be. What this repository
      # is actually judged on is hack/lab, and that needs all three checked out,
      # so it is not run from CI.
      - name: Tests
        run: make test-with-coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
