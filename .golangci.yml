version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  settings:
    govet:
      disable:
        - composites
    staticcheck:
      checks:
        - all
        - -QF*
        - -SA1019
        - -ST*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kubewharf/kubezoo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
